name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Verify generated project
        run: |
          xcodegen generate
          git diff --exit-code -- Lokalweb.xcodeproj
      - name: Run tests
        run: |
          xcodebuild \
            -project Lokalweb.xcodeproj \
            -scheme Lokalweb \
            -configuration Debug \
            -derivedDataPath .build/DerivedData \
            test CODE_SIGNING_ALLOWED=NO
